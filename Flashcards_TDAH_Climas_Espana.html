<!DOCTYPE html><html><head><meta charset="utf-8"><title>Flashcards Climas de España</title><style>body{font-family:Arial,sans-serif;background:#f4f8ff;padding:20px}h1{text-align:center}.card{background:white;border-radius:12px;padding:15px;margin:12px auto;max-width:700px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}.q{font-weight:bold;font-size:1.1em}.a{display:none;color:#0b5}.card.show .a{display:block;margin-top:10px}button{padding:10px 14px;border:none;background:#2563eb;color:white;border-radius:8px}</style></head><body><h1>🌍 Flashcards: El desafío climático en España</h1><p>Haz clic en cada tarjeta para ver la respuesta.</p><div id="cards"></div><script>const data=[['¿Qué es el clima?','Las condiciones atmosféricas de un lugar durante muchos años.'],['¿Qué mide un termómetro?','La temperatura.'],['¿Qué mide un pluviómetro?','Las precipitaciones.'],['¿Cuáles son los elementos del clima?','Temperatura y precipitaciones.'],['¿Qué tres factores modifican el clima?','Distancia al ecuador, mar y relieve.'],['¿Cuántos climas principales hay en España?','Cuatro.'],['¿Cuáles son?','Mediterráneo, oceánico, subtropical y de montaña.'],['¿Dónde está el clima subtropical?','En Canarias.'],['¿Cuál es el clima más extendido en España?','El mediterráneo.'],['¿Qué estación es la más seca en el clima mediterráneo?','El verano.'],['¿Cómo son las temperaturas del clima oceánico?','Suaves.'],['¿Cómo son las lluvias del clima oceánico?','Frecuentes.'],['¿Cómo son los inviernos en la montaña?','Muy fríos.'],['¿Qué gráfico sirve para estudiar el clima?','El climograma.'],['¿Qué representan las barras azules?','Las precipitaciones.'],['¿Qué representa la línea roja?','La temperatura.'],['¿Quién inició Fridays for Future?','Greta Thunberg.'],['¿Qué gas está relacionado con el calentamiento global?','CO₂.']];const c=document.getElementById('cards');data.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class=q>'+x[0]+'</div><div class=a>'+x[1]+'</div>';d.onclick=()=>d.classList.toggle('show');c.appendChild(d);});</script></body></html>
